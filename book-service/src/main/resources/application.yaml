server:
  port: ${SERVER_PORT}

spring:
  application:
    name: book-microservice

  datasource:
    url: ${DATASOURCE_URL}
    username: ${USER_DB}
    password: ${PASSWORD_DB}

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 2
      failureRateThreshold: 50
      waitDurationInOpenState: 10000

resilience4j.retry:
  instances:
    authorServiceRetry:
      maxAttempts: 3
      waitDuration: 500ms
      retryExceptions:
        - com.book_system.book_service.exception.AuthorServiceUnavailableException
        - feign.RetryableException
        - java.util.concurrent.TimeoutException

resilience4j.ratelimiter:
  configs:
    default:
      timeoutDuration: 1000
      limitRefreshPeriod: 5000
      limitForPeriod: 1

eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: "${EUREKA_SERVER_URL}"

management:
  health:
    circuitbreakers:
      enabled: true

  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
          - circuitbreakers
          - circuitbreakerevents

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

  info:
    env:
      enabled: true

logging:
  level:
    com.inventory: DEBUG
    org.springframework.cloud.consul: DEBUG

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0
    description: Book Microservice for orders-microservices
