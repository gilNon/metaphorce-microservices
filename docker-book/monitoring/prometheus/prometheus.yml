global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: service-discovery
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - service-discovery:8030

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:8080

  - job_name: author-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - author-service:8020

  - job_name: book-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - book-service:8010